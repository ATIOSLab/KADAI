services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-KADAI}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-this-secret}
      DATABASE_URL: ${DATABASE_URL}
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-false}
      RESET_DB_ON_START: ${RESET_DB_ON_START:-false}
    ports:
      - "3000"
    volumes:
      - product_uploads:/app/public/uploads

volumes:
  product_uploads:
